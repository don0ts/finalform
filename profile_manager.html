<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Profile Manager</title>
<link rel="stylesheet" href="css/profile_manager.css"/>
</head>
<body>
<header>
  <h1>PROFILE MANAGER</h1>
  <span class="sub" id="connState">Connecting…</span>
  <div class="spacer"></div>
  <a class="navlink" id="gotoHome" href="index.html">Home</a>
  <a class="navlink" id="gotoLogger" href="logger.html">Logger</a>
  <a class="navlink" id="gotoStatus" href="status.html">Status</a>
  <button id="mergeBtn">Merge</button>
  <button class="primary" id="addBtn">+ New profile</button>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <span class="mut">🔍</span>
      <input type="text" id="search" placeholder="Search by name, ID or position…" autocomplete="off"/>
    </div>
    <span class="count-note" id="countNote"></span>
  </div>

  <div id="statusBox" class="status">Loading profiles…</div>

  <div class="tablewrap" id="tableWrap" style="display:none">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="js/profile_manager.js"></script>

<script type="module">
// ==== Firestore connection (same project / collection as the data-entry tool) ====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// >>> PASTE THE SAME CONFIG YOU USED IN THE DATA-ENTRY TOOL <<<
// Firebase console -> Project settings -> Your apps -> SDK setup and configuration
const firebaseConfig = {
  apiKey: "AIzaSyDzxseQexlbv0onZH2l5PHNDa5ZKFv5Kz8",
  authDomain: "cubsentry.web.app",
  projectId: "cubsentry",
  storageBucket: "cubsentry.firebasestorage.app",
  messagingSenderId: "929110932897",
  appId: "1:929110932897:web:1d91596a2787084a085fe0"
};
const COLLECTION = "Players"; // must match the data-entry tool

function setState(txt,cls){ const s=document.getElementById('connState'); if(s){ s.textContent=txt; s.style.color = cls==='ok'?'#22c55e':(cls==='bad'?'#f87171':''); } }

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const col = collection(db, COLLECTION);
  window.__setRows = null; // set below via closure
  const api = {
    upsert(id, data){ return setDoc(doc(db, COLLECTION, String(id)), data, { merge: true }); },
    remove(id){ return deleteDoc(doc(db, COLLECTION, String(id))); }
  };
  // hand the API + live data to the non-module script via globals it reads
  window.CubSentryDB = api;
  if(window.__setDB) window.__setDB(api);
  onSnapshot(col, snap => {
    const list = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
    setState('Connected \u2022 live', 'ok');
    if(window.__applyData) window.__applyData(list, api);
  }, err => {
    console.warn('Firestore listen error:', err);
    setState('Connection error \u2014 check your config', 'bad');
    const sb=document.getElementById('statusBox'); if(sb){ sb.className='status err'; sb.style.display=''; sb.textContent='Could not read the database. Paste your Firebase keys into this file (same as the data-entry tool) and reload.'; }
  });
} catch(e){
  console.warn('Firebase init failed:', e);
  setState('Not connected', 'bad');
  const sb=document.getElementById('statusBox'); if(sb){ sb.className='status err'; sb.style.display=''; sb.textContent='Firebase is not configured. Paste your Firebase keys into this file (the same config used by the data-entry tool) and reload.'; }
}
</script>
</body>
</html>

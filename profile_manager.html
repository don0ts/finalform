<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Profile Manager</title>
<link rel="stylesheet" href="css/profile_manager.css"/>
</head>
<body>
<header>
  <h1>PROFILE MANAGER</h1>
  <span class="sub" id="connState">Connecting…</span>
  <div class="spacer"></div>
  <a class="navlink" id="gotoHome" href="index.html">Home</a>
  <a class="navlink" id="gotoLogger" href="logger.html">Logger</a>
  <a class="navlink" id="gotoCharting" href="charting.html">Charting</a>
  <a class="navlink" id="gotoStatus" href="status.html">Status</a>
  <button id="mergeBtn">Merge</button>
  <button class="primary" id="addBtn">+ New profile</button>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <span class="mut">🔍</span>
      <input type="text" id="search" placeholder="Search by name, ID or position…" autocomplete="off"/>
    </div>
    <span class="count-note" id="countNote"></span>
  </div>

  <div id="statusBox" class="status">Loading profiles…</div>

  <div class="tablewrap" id="tableWrap" style="display:none">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="cards" id="cards"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="js/profile_manager.js"></script>

<script src="js/firebase_config.js"></script>
<script type="module">
// ==== Firestore connection (same project / collection as the data-entry tool) ====
// Settings come from the shared js/firebase_config.js; the SDK is loaded
// dynamically so a blocked CDN reports a reason instead of spinning forever.
var FBC = window.FIREBASE_CONFIG || {};
var SDKV = window.FIREBASE_SDK_MODULAR || '10.12.2';
var COLLECTION = "Players"; // must match the data-entry tool

function setState(txt,cls){ if(window.fbConnState && txt.indexOf('Connected')===0) window.fbConnState('ok',txt); var s=document.getElementById('connState'); if(s){ s.textContent=txt; s.style.color = cls==='ok'?'#22c55e':(cls==='bad'?'#f87171':''); } }
function offlineApi(){ return { upsert(){ return Promise.reject(new Error('Database not connected')); }, remove(){ return Promise.reject(new Error('Database not connected')); } }; }

if(!FBC.apiKey || !FBC.projectId){
  setState('Not connected — firebase config missing (js/firebase_config.js)','bad');
  var _a0=offlineApi(); window.CubSentryDB=_a0; if(window.__setDB) window.__setDB(_a0);
} else {
Promise.all([
  import('https://www.gstatic.com/firebasejs/'+SDKV+'/firebase-app.js'),
  import('https://www.gstatic.com/firebasejs/'+SDKV+'/firebase-firestore.js')
]).then(function(mods){
  var initializeApp=mods[0].initializeApp;
  var fsMod=mods[1];
  var getFirestore=fsMod.getFirestore, collection=fsMod.collection, doc=fsMod.doc, setDoc=fsMod.setDoc,
      deleteDoc=fsMod.deleteDoc, onSnapshot=fsMod.onSnapshot, enableIndexedDbPersistence=fsMod.enableIndexedDbPersistence;
  try {
    const app = initializeApp(FBC);
    const db = getFirestore(app);
    // Offline support: cache Firestore data locally so profiles load and edits
    // queue/sync even without a connection.
    try { enableIndexedDbPersistence(db).catch(function(e){ console.warn('Offline persistence unavailable:', e && e.code || e); }); } catch(e) { console.warn('Offline persistence unavailable:', e); }
    const col = collection(db, COLLECTION);
    let cache = [];
    try { const _s=localStorage.getItem('cubs_last_players'); if(_s) cache=JSON.parse(_s)||[]; } catch(e){}
    const api = {
      upsert(id, data){ return setDoc(doc(db, COLLECTION, String(id)), data, { merge: true }); },
      remove(id){ return deleteDoc(doc(db, COLLECTION, String(id))); }
    };
    window.CubSentryDB = api;
    if(window.__setDB) window.__setDB(api);
    onSnapshot(col, snap => {
      const list = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
      cache = list;
      try { localStorage.setItem('cubs_last_players', JSON.stringify(list)); } catch(e){}
      setState('Connected \u2022 live', 'ok');
      if(window.__applyData) window.__applyData(list, api);
    }, err => {
      console.warn('Firestore listen error:', err);
      setState('Disconnected — showing saved data', 'bad');
      try { const _s=localStorage.getItem('cubs_last_players'); if(_s && window.__applyData) window.__applyData(JSON.parse(_s)||[], api); } catch(e){}
    });
  } catch(e){
    console.warn('Firebase init failed:', e);
    setState('Not connected — showing saved data', 'bad');
    var _a=offlineApi(); window.CubSentryDB=_a; if(window.__setDB) window.__setDB(_a);
  }
}).catch(function(err){
  console.warn('Firebase SDK load failed (Profiles)', err);
  setState('SDK failed to load — check your connection/firewall', 'bad');
  var _a=offlineApi(); window.CubSentryDB=_a; if(window.__setDB) window.__setDB(_a);
});
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Status – Last Date Taken</title>
<link rel="stylesheet" href="css/status.css"/>
</head>
<body>
<header>
  <h1>STATUS — LAST DATE TAKEN</h1>
  <span class="sub" id="connState">Connecting…</span>
  <div class="spacer"></div>
  <a class="navlink" id="gotoHome" href="index.html">Home</a>
  <a class="navlink" id="gotoLogger" href="logger.html">Logger</a>
  <a class="navlink" id="gotoCharting" href="charting.html">Charting</a>
  <a class="navlink" id="gotoProfiles" href="profile_manager.html">Profiles</a>
  <div class="legend">
    <span class="pill"><span class="sw g"></span>&lt; 2 months</span>
    <span class="pill"><span class="sw y"></span>&ge; 2 months</span>
    <span class="pill"><span class="sw r"></span>&ge; 6 months</span>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      <span class="mut">🔍</span>
      <input type="text" id="search" placeholder="Search by name or ID…" autocomplete="off"/>
    </div>
    <span class="count-note" id="countNote"></span>
    <button class="ghost" id="downloadSheetBtn">Download Sheet</button>
  </div>

  <div id="statusBox" class="status">Loading status…</div>

  <div class="tablewrap" id="tableWrap" style="display:none">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="js/status.js"></script>

<script src="js/firebase_config.js"></script>
<script type="module">
// Firebase settings come from the one shared file so this page can never drift
// from Home. The SDK is loaded dynamically: a blocked CDN now shows a clear
// reason instead of an endless "Connecting…".
var FBC = window.FIREBASE_CONFIG || {};
var SDKV = window.FIREBASE_SDK_MODULAR || '10.12.2';
var COLLECTION = "Players"; // must match the data-entry tool

function sdkLoad(file){
  var urls=[];
  if(window.FIREBASE_SDK_LOCAL) urls.push(window.FIREBASE_SDK_LOCAL.replace(/\/$/,'')+'/'+file);
  urls.push('https://www.gstatic.com/firebasejs/'+SDKV+'/'+file);
  urls.push('https://cdn.jsdelivr.net/npm/firebase@'+SDKV+'/'+file);
  urls.push('https://unpkg.com/firebase@'+SDKV+'/'+file);
  var i=0;
  function next(){
    if(i>=urls.length) return Promise.reject(new Error('Could not load '+file+' from any source'));
    var u=urls[i++];
    return import(u).catch(function(e){ console.warn('Firebase SDK unavailable at '+u, e && e.message || e); return next(); });
  }
  return next();
}

function setState(txt,cls){ if(window.fbConnState && (txt.indexOf('Connected')===0 || txt.indexOf('Not connected')===0 || txt.indexOf('SDK')===0 || txt.indexOf('Connecting')===0)) { window.fbConnState(cls==='ok'?'ok':'bad', txt); } var s=document.getElementById('connState'); if(s){ s.textContent=txt; s.style.color = cls==='ok'?'#22c55e':(cls==='bad'?'#f87171':''); } }
function offlineApi(){
  var last=null; try{ last=JSON.parse(localStorage.getItem('cubs_last_players')||'null'); }catch(e){}
  return {
    ready:false,
    _offline:true,
    upsert(){ return Promise.reject(new Error('Database not connected')); },
    remove(){ return Promise.reject(new Error('Database not connected')); },
    setStatusDate(){ return Promise.reject(new Error('Database not connected')); },
    clearStatusDate(){ return Promise.reject(new Error('Database not connected')); },
    pushStatusHist(){ return Promise.reject(new Error('Database not connected')); },
    removeStatusHist(){ return Promise.reject(new Error('Database not connected')); }
  };
}
setState('Connecting…','');

if(!FBC.apiKey || !FBC.projectId){
  setState('Not connected — firebase config missing (js/firebase_config.js)','bad');
  var _api0=offlineApi(); window.CubSentryDB=_api0; if(window.__setDB) window.__setDB(_api0);
  try { const _s=localStorage.getItem('cubs_last_players'); if(_s && window.__applyData) window.__applyData(JSON.parse(_s)||[], _api0); } catch(e){}
} else {
Promise.all([sdkLoad('firebase-app.js'), sdkLoad('firebase-firestore.js')]).then(function(mods){
  var appMod=mods[0], fsMod=mods[1];
  var initializeApp=appMod.initializeApp;
  var getFirestore=fsMod.getFirestore, collection=fsMod.collection, doc=fsMod.doc, getDoc=fsMod.getDoc, getDocs=fsMod.getDocs,
      setDoc=fsMod.setDoc, updateDoc=fsMod.updateDoc, deleteDoc=fsMod.deleteDoc, deleteField=fsMod.deleteField,
      onSnapshot=fsMod.onSnapshot, enableIndexedDbPersistence=fsMod.enableIndexedDbPersistence;

  try {
    const app = initializeApp(FBC);
    const db = getFirestore(app);
    // Offline support: cache Firestore data locally so the last known status
    // table loads even without a connection, and edits sync when it returns.
    try { enableIndexedDbPersistence(db).catch(function(e){ console.warn('Offline persistence unavailable:', e && e.code || e); }); } catch(e) { console.warn('Offline persistence unavailable:', e); }
    const col = collection(db, COLLECTION);
    // Last-known snapshot fallback for the first offline load.
    try { const _s=localStorage.getItem('cubs_last_players'); if(_s){ const _list=JSON.parse(_s)||[]; if(window.__applyData) window.__applyData(_list, null); } } catch(e){}
    const api = {
      ready:true,
      upsert(id, data){ return setDoc(doc(db, COLLECTION, String(id)), data, { merge: true }); },
      remove(id){ return deleteDoc(doc(db, COLLECTION, String(id))); },
      setStatusDate(id, group, value){ var u={}; u['status.'+group]=value; return updateDoc(doc(db, COLLECTION, String(id)), u); },
      clearStatusDate(id, group){ var u={}; u['status.'+group]=deleteField(); return updateDoc(doc(db, COLLECTION, String(id)), u); },
      // Append a date to that group's dated history (used to step back when a
      // group checkbox is turned off). Keeps the newest 40, newest first.
      pushStatusHist(id, group, value){
        var ref=doc(db, COLLECTION, String(id));
        return getDoc(ref).then(function(snap){
          var data=snap.exists()?snap.data():{};
          var hist=(data.statusHist&&data.statusHist[group])||[];
          hist=hist.filter(function(x){ return String(x)!==String(value); });
          hist.unshift(String(value));
          if(hist.length>40) hist=hist.slice(0,40);
          var u={}; u['statusHist.'+group]=hist;
          return updateDoc(ref,u);
        });
      },
      // Remove one date from a group's history (the content for that date was
      // deleted, so it must never be stepped back onto).
      removeStatusHist(id, group, value){
        var ref=doc(db, COLLECTION, String(id));
        return getDoc(ref).then(function(snap){
          var data=snap.exists()?snap.data():{};
          var hist=(data.statusHist&&data.statusHist[group])||[];
          hist=hist.filter(function(x){ return String(x)!==String(value); });
          var u={}; u['statusHist.'+group]=hist;
          return updateDoc(ref,u);
        });
      }
    };
    window.CubSentryDB = api;
    if(window.__setDB) window.__setDB(api);
    // Watchdog: Firestore can sit silently "connecting" (blocked websocket,
    // firewall, suspended tab). If the first snapshot has not arrived by then,
    // read once over straight HTTP and switch the listener to long-polling so
    // the page still shows real data instead of a permanent "Connecting…".
    var _got=false, _watch=setTimeout(function(){ if(_got) return; _probe(); }, 12000);
    function _probe(){
      setState('Connecting… (retrying over HTTP)', '');
      getDocs(col).then(function(snap){
        _got=true; clearTimeout(_watch);
        const list = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
        try { localStorage.setItem('cubs_last_players', JSON.stringify(list)); } catch(e){}
        setState('Connected (HTTP refresh)', 'ok');
        if(window.__applyData) window.__applyData(list, api);
      }).catch(function(e){
        console.warn('Probe read failed:', e && (e.code||e.message));
        // nothing readable either: keep the last known data visible and say why
        setState('Not connected — ' + ((e && (e.code || e.message)) ? (e.code || e.message) : 'network blocked'), 'bad');
        try { const _s=localStorage.getItem('cubs_last_players'); if(_s && window.__applyData) window.__applyData(JSON.parse(_s)||[], api); } catch(e2){}
        setTimeout(function(){ if(!_got) _probe(); }, 20000);
      });
    }
    onSnapshot(col, snap => {
      _got=true; clearTimeout(_watch);
      const list = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
      try { localStorage.setItem('cubs_last_players', JSON.stringify(list)); } catch(e){}
      setState('Connected \u2022 live', 'ok');
      if(window.__applyData) window.__applyData(list, api);
    }, err => {
      console.warn('Firestore listen error:', err);
      setState('Disconnected — showing saved data', 'bad');
      try { const _s=localStorage.getItem('cubs_last_players'); if(_s && window.__applyData) window.__applyData(JSON.parse(_s)||[], api); } catch(e){}
    });
  } catch(e){
    console.warn('Firebase init failed:', e);
    setState('Not connected — showing saved data', 'bad');
    var _api=offlineApi(); window.CubSentryDB=_api; if(window.__setDB) window.__setDB(_api);
    try { const _s=localStorage.getItem('cubs_last_players'); if(_s && window.__applyData) window.__applyData(JSON.parse(_s)||[], _api); } catch(e2){}
  }
}).catch(function(err){
  console.warn('Firebase SDK load failed (Status)', err);
  setState('SDK failed to load — check your connection/firewall', 'bad');
  var _api=offlineApi(); window.CubSentryDB=_api; if(window.__setDB) window.__setDB(_api);
  try { const _s=localStorage.getItem('cubs_last_players'); if(_s && window.__applyData) window.__applyData(JSON.parse(_s)||[], _api); } catch(e){}
});
}
</script>
</body>
</html>
